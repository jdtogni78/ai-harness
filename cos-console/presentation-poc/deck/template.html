<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>__TITLE__</title>
<style>
  :root{
    --bg:#0e1117; --panel:#161b22; --panel2:#1c232d; --ink:#e6edf3; --muted:#8b949e;
    --line:#30363d; --accent:#4c9be8;
    --done:#3fb950; --todo:#d29922; --prog:#4c9be8; --blocked:#f85149; --nodata:#6e7681;
    --shadow:0 8px 30px rgba(0,0,0,.35);
  }
  *{box-sizing:border-box}
  html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);overflow-x:hidden;
    font:16px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif}
  #stage{height:100dvh;display:flex;align-items:center;justify-content:center;padding:clamp(12px,4vw,48px)}
  /* min-width:0 lets the flex item shrink below its content's min-content on
     narrow phones so headings/tiles wrap instead of overflowing to the right. */
  .slide{display:none;width:min(960px,100%);min-width:0;max-height:100%;overflow:auto}
  h1,h2,.narr,.tile .l{overflow-wrap:anywhere}
  .slide.on{display:block;animation:fade .35s ease}
  @keyframes fade{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
  .kicker{color:var(--accent);font-weight:600;letter-spacing:.08em;text-transform:uppercase;font-size:12px;margin:0 0 6px}
  h1{font-size:clamp(26px,5vw,44px);margin:.1em 0 .3em;line-height:1.1}
  h2{font-size:clamp(20px,3.6vw,30px);margin:0 0 .6em}
  .sub{color:var(--muted);margin:0 0 1.4em}
  .grid{display:grid;gap:14px}
  .kpis{grid-template-columns:repeat(auto-fit,minmax(150px,1fr))}
  .tile{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:18px 20px;box-shadow:var(--shadow)}
  .tile .n{font-size:clamp(28px,6vw,44px);font-weight:700;line-height:1}
  .tile .l{color:var(--muted);font-size:13px;margin-top:6px}
  .tile.na .n{color:var(--nodata)}
  .card{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:22px;box-shadow:var(--shadow)}
  .row{display:flex;gap:22px;flex-wrap:wrap;align-items:center}
  .legend{display:flex;gap:16px;flex-wrap:wrap;color:var(--muted);font-size:13px;margin-top:10px}
  .dot{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:6px;vertical-align:middle}
  ul.clean{list-style:none;padding:0;margin:.4em 0}
  ul.clean li{padding:9px 0;border-bottom:1px solid var(--line);display:flex;gap:10px;align-items:baseline}
  ul.clean li:last-child{border-bottom:0}
  .pill{font-size:11px;padding:2px 8px;border-radius:999px;border:1px solid var(--line);color:var(--muted);white-space:nowrap}
  .ok{color:var(--done);border-color:rgba(63,185,80,.4)}
  .warn{color:var(--todo);border-color:rgba(210,153,34,.4)}
  .fail{color:var(--blocked);border-color:rgba(248,81,73,.4)}
  .nodata-panel{border:2px dashed var(--nodata);border-radius:16px;padding:26px;
    background:repeating-linear-gradient(45deg,transparent,transparent 10px,rgba(110,118,129,.08) 10px,rgba(110,118,129,.08) 20px)}
  .nodata-panel .big{font-size:22px;font-weight:700;color:var(--nodata)}
  .narr{margin-top:22px;color:var(--muted);font-size:14px;border-left:3px solid var(--accent);
    padding:8px 0 8px 14px;background:linear-gradient(90deg,rgba(76,155,232,.08),transparent)}
  .narr b{color:var(--accent);font-weight:600}
  /* fixed chrome */
  #bar{position:fixed;left:0;right:0;bottom:0;height:4px;background:var(--panel2)}
  #fill{height:100%;background:var(--accent);width:0;transition:width .3s}
  #dots{position:fixed;bottom:14px;left:50%;transform:translateX(-50%);display:flex;gap:8px}
  #dots button{width:9px;height:9px;border-radius:50%;border:0;background:var(--nodata);cursor:pointer;padding:0}
  #dots button.on{background:var(--accent);transform:scale(1.3)}
  #hint{position:fixed;top:14px;right:16px;color:var(--muted);font-size:12px}
  .val{font-variant-numeric:tabular-nums}
  a{color:var(--accent)}
</style>
</head>
<body>
<div id="hint">← → / space · tap edges · <span id="pos"></span></div>
<div id="stage"></div>
<div id="dots"></div>
<div id="bar"><div id="fill"></div></div>

<script>
// ---- REAL data injected by: python -m deck.generate (StatusReport → deck) ----
// Anti-fabrication: `availability` gates every section. unavailable/null => a
// NO-DATA panel or "n/a" tile, NEVER a fabricated 0.
const R = __DECK_DATA__;

// A section is "live" only when availability says so AND the payload is present.
const avail = (k) => R.availability && (R.availability[k] === "live" || R.availability[k] === "partial");

// ---- reusable widgets ---------------------------------------------------
function ticketBar(t){
  const segs=[["done",t.done,"var(--done)"],["todo",t.todo,"var(--todo)"],
    ["in_progress",t.in_progress,"var(--prog)"],["blocked",t.blocked,"var(--blocked)"]]
    .filter(s=>Number(s[1])>0);
  const W=880,H=54; let x=0, r="";
  const total = t.total || segs.reduce((a,s)=>a+s[1],0) || 1;
  for(const [name,v,c] of segs){ const w=v/total*W;
    r+=`<rect x="${x}" y="0" width="${Math.max(0,w-2)}" height="${H}" rx="6" fill="${c}"></rect>`+
       (w>44?`<text x="${x+ (w-2)/2}" y="${H/2+5}" text-anchor="middle" font-size="16" font-weight="700" fill="#0e1117">${v}</text>`:"");
    x+=w; }
  return `<svg viewBox="0 0 ${W} ${H}" width="100%" height="${H}" role="img" aria-label="ticket states">${r}</svg>`;
}
const dot=(c)=>`<span class="dot" style="background:${c}"></span>`;
const noData=(what)=>`<div class="nodata-panel">
    <div class="big">NO DATA — this is NOT zero</div>
    <p class="sub" style="margin:.6em 0 0">${what} The console will <b>not</b> invent a value.</p>
  </div>`;
const narr=(n)=> n ? `<div class="narr">🔊 <b>narration:</b> "${n}"</div>` : "";

// ---- slide builders (order is fixed; content is availability-driven) -----
// Each entry pairs a widget id (stable, for the narration companion) with a
// render() -> html. Narration text comes from R.narration[widget].
const N = R.narration || {};
const builders = [
  { widget:"title", render:()=>{
      const tk = avail("tickets") ? `${R.tickets.done}/${R.tickets.total}` : "n/a";
      const tkNa = avail("tickets") ? "" : " na";
      let testTile = avail("tests") && R.tests.available
        ? `<div class="tile"><div class="n val">${R.tests.passing}/${R.tests.count}</div><div class="l">tests passing</div></div>`
        : `<div class="tile na"><div class="n">n/a</div><div class="l">tests — no data</div></div>`;
      let depTile = avail("deploy") && R.deploy.status
        ? `<div class="tile"><div class="n" style="color:var(--done)">${String(R.deploy.status).toUpperCase()}</div><div class="l">last deploy</div></div>`
        : `<div class="tile na"><div class="n">n/a</div><div class="l">deploy — no data</div></div>`;
      let decTile = avail("decisions")
        ? `<div class="tile"><div class="n val">${R.decisions.length}</div><div class="l">recent decisions</div></div>`
        : `<div class="tile na"><div class="n">n/a</div><div class="l">decisions — no data</div></div>`;
      return `<p class="kicker">Chief-of-Staff · status readout</p>
        <h1>${R.project} — where things stand</h1>
        <p class="sub">Generated ${R.generated_at} · sourced live from the harness, no code read</p>
        <div class="grid kpis">
          <div class="tile${tkNa}"><div class="n val">${tk}</div><div class="l">tickets done</div></div>
          ${testTile}${depTile}${decTile}
        </div>${narr(N.title)}`;
    }},
  { widget:"tickets", render:()=>{
      if(!avail("tickets")) return `<p class="kicker">Delivery</p><h2>Tickets</h2>
        ${noData("Ticket board status was not reachable.")}${narr(N.tickets)}`;
      const t=R.tickets;
      return `<p class="kicker">Delivery</p><h2>Tickets — ${t.done} done, ${t.todo} to do</h2>
        <div class="card">${ticketBar(t)}
          <div class="legend">
            ${dot('var(--done)')}done ${t.done}
            ${dot('var(--todo)')}todo ${t.todo}
            ${dot('var(--prog)')}in&nbsp;progress ${t.in_progress}
            ${dot('var(--blocked)')}blocked ${t.blocked}
          </div>
        </div>${narr(N.tickets)}`;
    }},
  { widget:"tests", render:()=>{
      if(avail("tests") && R.tests.available){
        const q=R.tests;
        const cov = q.coverage_pct==null ? "" :
          `<div><div class="l" style="color:var(--muted);font-size:13px">coverage</div><div style="font-size:20px" class="val">${q.coverage_pct}%</div></div>`;
        return `<p class="kicker">Quality</p><h2>Tests <span class="pill ${q.failing>0?'fail':'ok'}">${q.failing>0?q.failing+' failing':'green'}</span></h2>
          <div class="card row">
            <div><div class="l" style="color:var(--muted);font-size:13px">passing</div><div style="font-size:20px" class="val">${q.passing}/${q.count}</div></div>
            <div><div class="l" style="color:var(--muted);font-size:13px">failing</div><div style="font-size:20px" class="val">${q.failing}</div></div>
            <div><div class="l" style="color:var(--muted);font-size:13px">skipped</div><div style="font-size:20px" class="val">${q.skipped}</div></div>
            ${cov}
          </div>${narr(N.tests)}`;
      }
      return `<p class="kicker">Quality</p><h2>Tests</h2>
        ${noData("No surefire/JaCoCo artifacts found — the suite hasn't been run (or didn't emit reports).")}
        ${narr(N.tests)}`;
    }},
  { widget:"deploy", render:()=>{
      if(!avail("deploy")) return `<p class="kicker">Operations</p><h2>Last deploy</h2>
        ${noData("No deploy log entry was reachable for this target.")}${narr(N.deploy)}`;
      const d=R.deploy;
      const cls = d.status==="ok"?"ok":d.status==="failed"?"fail":"warn";
      return `<p class="kicker">Operations</p><h2>Last deploy <span class="pill ${cls}">${d.status}</span></h2>
        <div class="card row">
          <div><div class="l" style="color:var(--muted);font-size:13px">when</div><div style="font-size:20px">${d.last_deployed_at||"—"}</div></div>
          <div><div class="l" style="color:var(--muted);font-size:13px">environment</div><div style="font-size:20px">${d.env||"—"}</div></div>
          <div><div class="l" style="color:var(--muted);font-size:13px">commit</div><div style="font-size:20px" class="val">${d.commit||"—"}</div></div>
          <div><div class="l" style="color:var(--muted);font-size:13px">duration</div><div style="font-size:20px">${d.duration_s!=null?d.duration_s+"s":"—"}</div></div>
        </div>${narr(N.deploy)}`;
    }},
  { widget:"visual", render:()=>{
      if(!avail("visual_review")) return `<p class="kicker">Review</p><h2>Visual review</h2>
        ${noData("The demos directory was not reachable.")}${narr(N.visual)}`;
      const a=R.visual_review.artifacts||[];
      return `<p class="kicker">Review</p><h2>Visual review — ${a.length} artifacts</h2>
        <div class="card"><ul class="clean">
          ${a.slice(0,8).map(x=>`<li><span class="pill">${x.kind||x.k||"artifact"}</span> <span>${x.name||x.n}</span></li>`).join("")}
          ${a.length>8?`<li style="color:var(--muted)">…and ${a.length-8} more</li>`:""}
        </ul></div>${narr(N.visual)}`;
    }},
  { widget:"decisions", render:()=>{
      if(!avail("decisions")) return `<p class="kicker">Trail</p><h2>Decisions</h2>
        ${noData("Decision history was not reachable.")}${narr(N.decisions)}`;
      const ds=R.decisions||[]; const sample=ds.slice(0,5);
      return `<p class="kicker">Trail</p><h2>${ds.length} recent decisions</h2>
        <div class="card"><ul class="clean">
          ${sample.map(d=>`<li>${d.summary||d}</li>`).join("")}
          ${ds.length>sample.length?`<li style="color:var(--muted)">…and ${ds.length-sample.length} more</li>`:""}
        </ul></div>${narr(N.decisions)}`;
    }},
  { widget:"open_questions", render:()=>{
      const q=R.open_questions||[];
      const body = q.length
        ? q.map(x=>`<div style="font-size:20px">⚠︎ ${x}</div>`).join("")
        : `<div style="font-size:20px;color:var(--done)">✓ No open questions flagged.</div>`;
      return `<p class="kicker">For you</p><h2>Open ${q.length===1?"question":"questions"}</h2>
        <div class="card" style="border-color:rgba(210,153,34,.4)">${body}</div>
        <p class="sub" style="margin-top:22px">This whole deck is one self-contained <code>.html</code> — generated from <code>status_mcp.probe ${R.project}</code>, no build step, opens on your phone.</p>
        ${narr(N.open_questions)}`;
    }},
];

// ---- generic report mode --------------------------------------------------
// The same chrome (CSS + nav below) renders TWO kinds of deck:
//   * StatusReport   -> the `builders` above (project status).
//   * Generic report -> `R.slides`, a list of pre-rendered {widget, kicker,
//     title|heading, subtitle, html, narration} slides. This is what the
//     `report` skill emits for a manager-activity recap, so it reuses this
//     renderer instead of duplicating it. Slide `html` uses the SAME widget
//     classes (.tile/.card/.clean/.nodata-panel) for a consistent look.
function renderGeneric(s){
  const kicker = s.kicker ? `<p class="kicker">${s.kicker}</p>` : "";
  const head = s.title ? `<h1>${s.title}</h1>`
             : s.heading ? `<h2>${s.heading}</h2>` : "";
  const sub  = s.subtitle ? `<p class="sub">${s.subtitle}</p>` : "";
  return `${kicker}${head}${sub}${s.html||""}${narr(s.narration)}`;
}

// ---- render + navigation (hash-driven so narrate-demo's `goto #n` advances) --
const slides = (Array.isArray(R.slides) && R.slides.length)
  ? R.slides.map(renderGeneric)
  : builders.map(b=>b.render());
let i=0; const stage=document.getElementById('stage'), dots=document.getElementById('dots');
stage.innerHTML = slides.map((s,n)=>`<section class="slide" data-n="${n}">${s}</section>`).join("");
dots.innerHTML = slides.map((_,n)=>`<button aria-label="slide ${n+1}" onclick="go(${n})"></button>`).join("");
const secs=[...document.querySelectorAll('.slide')], dbtn=[...dots.children];
function go(n){ i=Math.max(0,Math.min(slides.length-1,n));
  secs.forEach((s,k)=>s.classList.toggle('on',k===i));
  dbtn.forEach((b,k)=>b.classList.toggle('on',k===i));
  document.getElementById('fill').style.width=((i+1)/slides.length*100)+'%';
  document.getElementById('pos').textContent=`${i+1}/${slides.length}`;
  if(String(i) !== location.hash.slice(1)){ try{ history.replaceState(null,"",'#'+i); }catch(e){ location.hash=i; } }
}
// go(n) is exactly what a voice-brain would call over a websocket ("show_slide").
// It is ALSO driven by the URL hash, so `narrate-demo`'s `do: goto url#N` steps
// advance the deck without any custom automation verbs.
window.go=go;
function fromHash(){ const h=parseInt(location.hash.slice(1),10); go(Number.isNaN(h)?i:h); }
addEventListener('hashchange',fromHash);
addEventListener('keydown',e=>{ if(['ArrowRight',' '].includes(e.key))go(i+1);
  else if(e.key==='ArrowLeft')go(i-1); });
addEventListener('click',e=>{ if(e.target.closest('#dots'))return;
  go(e.clientX < innerWidth/2 ? i-1 : i+1); });
// initial slide from hash (deep-link / narrate prewarm) or 0
if(location.hash && !Number.isNaN(parseInt(location.hash.slice(1),10))) fromHash(); else go(0);
</script>
</body>
</html>
