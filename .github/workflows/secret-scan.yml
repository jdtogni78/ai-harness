name: Secret Scan

# Block any commit / PR that adds a secret to the public repo.
#
# Runs the official gitleaks binary (pinned by version) against the full git
# history, using the in-repo .gitleaks.toml ruleset. Exits non-zero on any
# finding, which fails the job and blocks the merge.
#
# We install the binary from the gitleaks release tarball rather than using
# gitleaks/gitleaks-action@v2 to avoid the action's license-server check
# (which can break for org repos) and to keep the pinning explicit.

on:
  push:
    branches: ['**']
  pull_request:

permissions:
  contents: read

jobs:
  gitleaks:
    name: gitleaks
    runs-on: ubuntu-latest
    env:
      # Keep in sync with .pre-commit-config.yaml so local + CI agree.
      GITLEAKS_VERSION: 8.30.1
    steps:
      - name: Check out repo (full history)
        uses: actions/checkout@v4
        with:
          # gitleaks scans history; shallow checkout would miss older commits.
          fetch-depth: 0

      - name: Install gitleaks
        run: |
          set -euo pipefail
          tmp="$(mktemp -d)"
          url="https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "Fetching $url"
          curl -fsSL "$url" -o "$tmp/gitleaks.tar.gz"
          tar -xzf "$tmp/gitleaks.tar.gz" -C "$tmp"
          install -m 0755 "$tmp/gitleaks" /usr/local/bin/gitleaks
          gitleaks version

      - name: Scan repo history for secrets
        run: |
          gitleaks detect \
            --source . \
            --config .gitleaks.toml \
            --redact \
            --no-banner \
            --verbose \
            --exit-code 1
